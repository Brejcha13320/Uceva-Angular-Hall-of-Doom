name: Deploy to Siteground - HallOfDoom

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Clonar el repositorio en la máquina del runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Configurar Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Configurar Angular CLI
      - name: Setup Angular CLI
        run: npm install -g @angular/cli

      # Instalar dependencias
      - name: Install Dependencies
        run: npm install

      # Build del Proyecto Angular
      - name: Build Angular Project
        run: ng build

      - name: Pruebas Consola
        run: |
          node -v
          ng version
          ls -la
          
